</style></head><body><header><div class="wrap"><a class="brand" href="index.html"><img src="favicon.svg" alt="Business Discovery Network logo"><span>Business Discovery<br>Network</span></a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="index.html#directory">Browse</a><a href="index.html#how">About</a><a class="btn" href="index.html#join">List a Business</a></nav></div></header>
<main><div class="page-hero" role="img" aria-label="Brisbane skyline, river and bridge"></div><section class="wrap intro"><a class="back" href="index.html">← All categories</a><div class="eyebrow">Browse Brisbane businesses</div><h1>Other</h1><p>Explore approved local other businesses and services. Select a listing to visit its website.</p><label for="search">Search within Other</label><input class="search" id="search" type="search" placeholder="Search businesses or service areas…" autocomplete="off"><p id="status" aria-live="polite">Loading approved listings…</p><div class="cards" id="cards"></div></section></main>
<footer><div class="wrap"><b>Business Discovery Network</b><p>Part of <a href="https://groundsupportcrew.com/">Ground Support Crew</a></p></div></footer>
<script>
const API="https://pulbcpjwxliwnmkiyfhe.supabase.co/functions/v1/business-discovery";
const terms=[],isOther=true,title="Other";
let selected=[],categories=[];
const root=document.getElementById("cards"),status=document.getElementById("status"),search=document.getElementById("search");
const isMatch=name=>terms.some(t=>name.toLowerCase().includes(t));
function render(){root.replaceChildren();const q=search.value.trim().toLowerCase();const matches=selected.filter(b=>[b.name,b.description,b.service_area].join(" ").toLowerCase().includes(q));status.textContent=matches.length?matches.length+" approved business"+(matches.length===1?"":"es"):"No matching businesses yet.";for(const b of matches){const card=document.createElement("article");card.className="card";const c=document.createElement("small");c.textContent=categories.find(x=>String(x.id)===String(b.category_id))?.name||title;const h=document.createElement("h2");h.textContent=b.name;const p=document.createElement("p");p.textContent=b.description||"";card.append(c,h,p);if(b.service_area){const area=document.createElement("p");area.textContent="Service area: "+b.service_area;card.append(area)}if(b.website_url&&/^https:\/\//i.test(b.website_url)){const a=document.createElement("a");a.href=b.website_url;a.target="_blank";a.rel=b.sponsored?"noopener noreferrer sponsored":"noopener noreferrer";a.textContent="Visit business website";card.append(a)}root.append(card)}}
fetch(API+"?action=directory").then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{categories=data.categories||[];const known=["food","drink","restaurant","cafe","café","coffee","catering","bar","bakery","dining","trade","service","builder","plumb","electric","repair","clean","maintenance","handyman","construction","it support","shop","retail","store","boutique","market","fashion","accommodation","hotel","motel","stay","lodging","bnb","hostel","resort","health","beauty","wellness","salon","hair","medical","fitness","spa"];selected=(data.businesses||[]).filter(b=>{const name=categories.find(c=>String(c.id)===String(b.category_id))?.name||"";return isOther?!known.some(t=>name.toLowerCase().includes(t)):isMatch(name)});render()}).catch(()=>{status.textContent="Listings are temporarily unavailable. Please try again later."});
search.addEventListener("input",render);
</script></body></html>
